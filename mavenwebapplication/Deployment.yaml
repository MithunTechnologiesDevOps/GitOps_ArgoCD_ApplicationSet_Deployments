apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-deployment
  namespace: production
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      application: maven
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 30
  template:
    metadata:
      name: maven-pod
      labels:
        application: maven
    spec:
      containers:
      - name: maven-container
        image: mithuntechnologies/maven-web-application:2
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
